{% extends "layout.html" %}

{% block title %}
    Edit Parking Slot
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <section class="panel">
            <div class="panel-header">
                <h3 class="mb-1">Edit Parking Lot</h3>
                <p class="text-secondary mb-0">Adjust lot settings, capacity, and pricing in one place.</p>
            </div>
            <div class="panel-body pt-2">
                <form method="POST" action="{{ url_for('edit_slot_post', slot_id=slot.lot_id) }}">
                    <div class="mb-3">
                        <label for="lot_title" class="form-label">Lot Title</label>
                        <input type="text" class="form-control" id="lot_title" name="lot_title" value="{{ slot.lot_title }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location" value="{{ slot.lot_location }}" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="pincode" class="form-label">Pincode</label>
                            <input type="text" class="form-control" id="pincode" name="pincode" value="{{ slot.lot_zip }}" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="number_of_slots" class="form-label">Max Number of Slots</label>
                            <input type="number" class="form-control" id="number_of_slots" name="number_of_slots" value="{{ slot.total_slots }}" required>
                        </div>
                    </div>
                    <div class="mt-3 mb-4">
                        <label for="charges_per_hour" class="form-label">Charges per Hour (₹)</label>
                        <input type="number" class="form-control" id="charges_per_hour" name="charges_per_hour" value="{{ slot.rate_per_hr }}" required>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-success px-4">Update Slot</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}

{% extends "layout.html" %}

{% block title %}
    Add Parking Slot
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <section class="panel">
            <div class="panel-header">
                <h3 class="mb-1">Add Parking Lot</h3>
                <p class="text-secondary mb-0">Create a new lot and generate available slots automatically.</p>
            </div>
            <div class="panel-body pt-2">
                <form method="POST" action="{{ url_for('add_slot_post') }}">
                    <div class="mb-3">
                        <label for="lot_title" class="form-label">Slot Title</label>
                        <input type="text" class="form-control" id="lot_title" name="lot_title" required>
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="pincode" class="form-label">Pincode</label>
                            <input type="text" class="form-control" id="pincode" name="pincode" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="number_of_slots" class="form-label">Max Number of Slots</label>
                            <input type="number" class="form-control" id="number_of_slots" name="number_of_slots" required>
                        </div>
                    </div>
                    <div class="mt-3 mb-4">
                        <label for="charges_per_hour" class="form-label">Charges per Hour (₹)</label>
                        <input type="number" class="form-control" id="charges_per_hour" name="charges_per_hour" required>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-success px-4">Add Slot</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
